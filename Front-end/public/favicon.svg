    stroke-opacity="0.65"
    stroke-width="1.5"
  />

  <path
    d="M32 14L47 20V30.5C47 40.5 40.7 48.7 32 52C23.3 48.7 17 40.5 17 30.5V20L32 14Z"
    fill="url(#background)"
    fill-opacity="0.18"
    stroke="url(#shield)"
    stroke-width="2.5"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <path
    d="M25.5 32L30 36.5L39 27.5"
